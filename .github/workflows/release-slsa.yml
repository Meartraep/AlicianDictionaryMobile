name: Release attested APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    name: Build, attest, and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.14 for Chaquopy
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify database release metadata
        shell: bash
        run: |
          set -euo pipefail
          # Version uniqueness is a release requirement: a database content change
          # without a new db_version makes the update silently unreachable.
          python scripts/verify_database_manifest.py
          python scripts/verify_database_versions.py
          python scripts/update_database_manifest.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build the signed ABI-specific release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alician-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${variable}"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          ./gradlew --no-daemon clean testDebugUnitTest lintRelease

          # AGP 9 cannot combine splits.abi with the ndk.abiFilters setting that
          # Chaquopy 17 requires, so each published APK is a separate build.
          safe_tag="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            ./gradlew --no-daemon assembleRelease -PtargetAbi="$abi"
            cp app/build/outputs/apk/release/app-release.apk \
              "dist/AlicianDictionary-${safe_tag}-${abi}.apk"
          done

      - name: Verify and package the signed APKs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          safe_tag="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}"
          expected_abis="arm64-v8a x86_64"
          for abi in $expected_abis; do
            apk="dist/AlicianDictionary-${safe_tag}-${abi}.apk"
            if [[ ! -f "$apk" ]]; then
              echo "::error::Missing release APK: ${apk}"
              exit 1
            fi
          done
          # Fail on leftovers from an earlier run of the same tag (for example the
          # former single universal APK), so a release never mixes both layouts.
          unexpected="$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name "AlicianDictionary-${safe_tag}-arm64-v8a.apk" \
            ! -name "AlicianDictionary-${safe_tag}-x86_64.apk" -print)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected APK files in dist:"
            echo "$unexpected"
            exit 1
          fi

          apksigner="$({ find "$ANDROID_HOME/build-tools" -type f -name apksigner -print0 || true; } | xargs -0 -r ls -1v | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          for abi in $expected_abis; do
            apk="dist/AlicianDictionary-${safe_tag}-${abi}.apk"
            "$apksigner" verify --verbose --print-certs "$apk"
            # Guards the ABI split, the trimmed jieba archive and the size budget.
            python scripts/verify_release_apk.py "$apk" --abi "$abi"
          done

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )
          echo "safe-tag=${safe_tag}" >> "$GITHUB_OUTPUT"

      - name: Generate signed SLSA build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          # One attestation covers both ABI-specific APKs.
          subject-path: "dist/*.apk"

      - name: Package the provenance bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" \
            "dist/AlicianDictionary-${{ steps.package.outputs.safe-tag }}.intoto.jsonl"

      - name: Retain the attested release files in the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-apk-${{ steps.package.outputs.safe-tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Alician Dictionary ${GITHUB_REF_NAME}"
          fi

      - name: Verify the published database matches the ledger
        shell: bash
        run: |
          set -euo pipefail
          # The bytes a user downloads must be the bytes the ledger recorded, so the
          # app either installs exactly that revision or refuses the update.
          python scripts/verify_database_versions.py --remote --retries 5 --delay 20