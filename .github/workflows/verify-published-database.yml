name: Verify database published from phone

# The phone stamps the version itself: it appends database-versions.json and
# re-projects database-manifest.json in its own commit. This workflow therefore
# writes nothing -- no bot commit, no run held for approval. It only enforces that
# the publication is allowed and that the claimed version is exactly the next one.
#
# The generic invariants (ledger history, manifest projection, bundled database)
# are covered by "Ledger, manifest and database agree", which runs on every pull
# request and is the required status check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "app/src/main/assets/translated.db"

permissions:
  contents: read

concurrency:
  group: verify-published-database-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Publishing allowlist and version step
    if: >
      startsWith(github.head_ref, 'db-publish/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Collect the changed paths and the ledger of the target branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          git show "origin/${BASE_REF}:database-versions.json" > base-ledger.json
          echo "changed paths:" && cat changed.txt
          echo "target branch ledger:" && python -c "import json;print([e['db_version'] for e in json.load(open('base-ledger.json',encoding='utf-8'))])"

      - name: Verify the publication
        shell: bash
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r line; do
            if [ -n "${line}" ]; then changed+=("${line}"); fi
          done < changed.txt
          python scripts/verify_published_database.py \
            --base-ledger base-ledger.json \
            --changed-files "${changed[@]}"
