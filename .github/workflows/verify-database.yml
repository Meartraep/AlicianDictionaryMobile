name: Verify database versioning

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/assets/translated.db"
      - "database-manifest.json"
      - "database-versions.json"
      - "scripts/database_versioning.py"
      - "scripts/update_database_manifest.py"
      - "scripts/verify_database_manifest.py"
      - "scripts/verify_database_versions.py"
      - "app/src/test/python/test_database_versioning.py"
      - "app/src/test/python/test_verify_published_database.py"
      - "app/src/test/python/test_dictionary_search.py"
      - "app/src/main/python/**"
      - "app/src/main/java/**"
      - "scripts/verify_published_database.py"
      - ".github/workflows/verify-database.yml"
      - ".github/workflows/verify-published-database.yml"
  # Deliberately unfiltered: this job is meant to be a required status check, and a
  # path filter would leave pull requests that do not touch the database waiting for a
  # check that never reports. It takes about 20 seconds.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ledger, manifest and database agree
    # Runs on every pull request, including db-publish/* ones: the phone stamps the
    # version before opening the pull request, so a publishing branch is already a
    # consistent state and must pass exactly like any other change.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the runtime dependency used by the bridge tests
        run: python -m pip install --no-cache-dir jieba==0.42.1

      - name: Manifest must describe the bundled database
        run: python scripts/verify_database_manifest.py

      - name: Versions must be unique, monotonic and traceable
        run: python scripts/verify_database_versions.py

      - name: A content change without a version bump must fail
        run: python scripts/update_database_manifest.py

      - name: Version guard tests
        env:
          PYTHONPATH: app/src/main/python:app/src/test/python
        run: |
          set -euo pipefail
          python -m unittest test_database_versioning
          python -m unittest test_verify_published_database

      - name: Dictionary feature tests
        env:
          PYTHONPATH: app/src/main/python
        run: python -m unittest test_dictionary_search -v
        working-directory: app/src/test/python

      - name: Publication signature tests
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir cryptography==50.0.2
          cd app/src/test/python
          PYTHONPATH="../../../scripts:../../../app/src/main/python:." python -m unittest test_publication_signature
